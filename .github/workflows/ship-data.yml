# ship-data.yml - the monthly run of the ship data pipeline (T12.2, docs/plans/T12.2-workflow.md).
# Every step calls run.py or installs the pinned tools: no logic here (TASKS.md, lesson of S12.0); the `if:` lines only
# read the stages' own outputs. A run ends with nothing (heartbeat), a release, or a PR whose merge publishes the
# draft - or red (SD10, SD11).
#   chain           ubuntu   tests, fetch (the one API call), previous, hauling (H1: never stops the chain, K2), diff,
#                            build, verify, draft release
#   gate            windows  last release and draft rendered with the same app, hash-exact (SD3); contact sheets
#   publish | pr    ubuntu   after a green gate: publish the draft, or open the PR (merge = approval, P6)
#   hauling-pr      ubuntu   a failed hauling step (H1, E1): alias PR on data/hauling-aliases (gap) or the issue
#                            "Hauling job failed"; publishes nothing
#   publish-merged  ubuntu   on the push of state/pending.json by Martin's merge: publish exactly that draft
#   heartbeat       ubuntu   state/last-run.json and the run's one line, in every run but a dry run (SD9)
# Artifacts carry reports only (JSON, CSV of hashes, the stages' summaries): never the catalog, ship files, holograms
# or pictures - those live in the draft release only (A17, SD7, SD10). tests/test_workflow.py checks this file.
name: ship data

on:
  schedule:
    - cron: '23 4 1 * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Chain up to verify and release --dry-run: no draft, no gate, no commit (the API is called once)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [state/pending.json]

permissions: {}

concurrency:
  group: ship-data
  cancel-in-progress: false

env:
  APP_REPO: MRiediger/sc-cargoplan
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  chain:
    name: chain (ubuntu)
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    outputs:
      appTag: ${{ steps.pins.outputs.appTag }}
      previous: ${{ steps.previous.outputs.previous }}
      changed: ${{ steps.diff.outputs.changed }}
      hauling: ${{ steps.hauling.outputs.status }}
      haulingStep: ${{ steps.hauling.outcome }}
      # outcome: the step's result before continue-on-error (GitHub docs, Contexts reference, steps context): failure
      # for a crashed hauling step, while the job goes on (K2)
      path: ${{ steps.verify.outputs.path }}
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Python packages (pins)
        run: python -m pip install --disable-pip-version-check -q -r tools/requirements.txt -r tools/requirements-dev.txt
      - name: npm packages (lock file)
        run: npm ci --prefix tools --no-audit --no-fund --silent
      - name: Pins
        id: pins
        run: python -I tools/run.py pins
      - name: Tests
        run: python -I -m pytest -p no:cacheprovider -q tests
      - name: Restore the model cache (models by SHA only, never the catalog - SD7)
        uses: actions/cache/restore@v6
        with:
          path: cache/models
          key: models-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: models-
      - name: Fetch (the one API call of the run)
        id: fetch
        env:
          MOTHERLODE_API_KEY: ${{ secrets.MOTHERLODE_API_KEY }}
        run: python -I tools/run.py fetch
      - name: Last release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/run.py previous
      - name: Hauling (templates and positions; a failure never stops the ship data - K2)
        id: hauling
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/run.py hauling
      - name: Diff
        id: diff
        run: python -I tools/run.py diff --previous work/previous-release
      - name: Build
        if: steps.diff.outputs.changed == 'true'
        run: python -I tools/run.py build
      - name: Verify
        id: verify
        if: steps.diff.outputs.changed == 'true'
        run: python -I tools/run.py verify --ci
      - name: Release assets (dry run)
        if: steps.diff.outputs.changed == 'true' && inputs.dry-run
        run: python -I tools/run.py release --dry-run
      - name: Draft release
        id: draft
        if: steps.diff.outputs.changed == 'true' && !inputs.dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/run.py draft
      - name: Save the model cache
        if: always() && steps.fetch.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: cache/models
          key: models-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-chain
          # tools/pins.json in every report artifact: upload-artifact roots it at the common ancestor of the search
          # paths, so an artifact of out/ paths alone would lose 'out/' (tests/test_workflow.py)
          path: |
            tools/pins.json
            work/fetch.json
            work/previous.json
            work/diff.json
            work/build.json
            work/verify.json
            work/hauling.json
            work/hauling-aliases-proposed.json
            out/numbers.tsv
            out/say-*.jsonl
          retention-days: 30
          if-no-files-found: ignore

  gate:
    name: gate (windows)
    needs: chain
    if: needs.chain.outputs.tag != ''
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out the app at its pinned tag (tools/pins.json appTag)
        uses: actions/checkout@v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ needs.chain.outputs.appTag }}
          path: app
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: app/global.json
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Python packages (pins)
        run: python -m pip install --disable-pip-version-check -q -r tools/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: reports-chain
      - name: Gate
        env:
          GH_TOKEN: ${{ github.token }}
          OLD: ${{ needs.chain.outputs.previous }}
          NEW: ${{ needs.chain.outputs.tag }}
        run: python -I tools/run.py gate --app app --old-tag "$OLD" --new-tag "$NEW"
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-gate
          path: |
            tools/pins.json
            work/gate.json
            work/gate/pics/old/pictures.csv
            work/gate/pics/old/values.csv
            work/gate/pics/new/pictures.csv
            work/gate/pics/new/values.csv
            work/gate/pics/new/report.txt
            out/say-*.jsonl
          retention-days: 30
          if-no-files-found: ignore

  publish:
    name: publish (ubuntu)
    needs: [chain, gate]
    if: needs.chain.outputs.path == 'release' && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Python packages (pins)
        run: python -m pip install --disable-pip-version-check -q -r tools/requirements.txt
      - name: Restore the model cache
        uses: actions/cache/restore@v6
        with:
          path: cache/models
          key: models-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: models-
      - name: Publish the draft
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.chain.outputs.tag }}
        run: python -I tools/run.py publish --tag "$TAG"
      - name: Save the pruned model cache
        uses: actions/cache/save@v6
        with:
          path: cache/models
          key: models-${{ github.run_id }}-${{ github.run_attempt }}-published
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-publish
          path: |
            tools/pins.json
            out/numbers.tsv
            out/say-*.jsonl
          retention-days: 30
          if-no-files-found: ignore

  pr:
    name: pr (ubuntu)
    needs: [chain, gate]
    if: needs.chain.outputs.path == 'pr' && needs.gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Python packages (pins)
        run: python -m pip install --disable-pip-version-check -q -r tools/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          merge-multiple: true
      - name: Open the PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.chain.outputs.tag }}
        run: python -I tools/run.py pr --tag "$TAG"
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-pr
          path: |
            tools/pins.json
            out/pr-body.md
            out/say-*.jsonl
          retention-days: 30
          if-no-files-found: ignore

  hauling-pr:
    name: hauling report (ubuntu)
    needs: chain
    if: always() && (needs.chain.outputs.hauling == 'failed' || needs.chain.outputs.haulingStep == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Python packages (pins)
        run: python -m pip install --disable-pip-version-check -q -r tools/requirements.txt
      - uses: actions/download-artifact@v8
        with:
          name: reports-chain
      - name: Alias PR or issue
        if: inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/run.py hauling-pr
      - name: Alias PR or issue (dry run, text only)
        if: inputs.dry-run == true
        run: python -I tools/run.py hauling-pr --dry-run
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-hauling-pr
          path: |
            tools/pins.json
            out/hauling-pr-body.md
            out/hauling-issue.md
            out/say-*.jsonl
          retention-days: 30
          if-no-files-found: ignore

  publish-merged:
    name: publish after the merge (ubuntu)
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Python packages (pins)
        run: python -m pip install --disable-pip-version-check -q -r tools/requirements.txt
      - name: Restore the model cache
        uses: actions/cache/restore@v6
        with:
          path: cache/models
          key: models-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: models-
      - name: Publish the draft the merged PR names
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I tools/run.py publish --pending state/pending.json
      - name: Save the pruned model cache
        uses: actions/cache/save@v6
        with:
          path: cache/models
          key: models-${{ github.run_id }}-${{ github.run_attempt }}-published
      - name: Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports-publish-merged
          path: |
            tools/pins.json
            out/numbers.tsv
            out/say-*.jsonl
          retention-days: 30
          if-no-files-found: ignore

  heartbeat:
    name: heartbeat (ubuntu)
    needs: [chain, gate, publish, pr, hauling-pr, publish-merged]
    if: always() && !inputs.dry-run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - name: Python packages (pins)
        run: python -m pip install --disable-pip-version-check -q -r tools/requirements.txt
      - name: Reports of the jobs before
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: reports-*
          merge-multiple: true
      - name: Heartbeat
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python -I tools/run.py heartbeat
