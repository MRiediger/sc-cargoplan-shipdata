# S12.0 spike (docs/plans/S12.0-spike.md): one ship end-to-end, to measure. Throwaway; not the pipeline.
#   chain   (ubuntu 24.04)   catalog (API once, cached) -> scraper probe -> model -> flatten -> ladder -> export -> outline -> anchor
#   gate-a  (windows)  app v0.5.1 as released: picture run A1 (holo-v3), A2 (holo-v2, the real changes)
#   gate-b  (windows)  same VM: B0 (as released) and B (built files swapped in), baseline B0 (K1)
# Every step ends with "checked / found / to do" in the log and the job summary; numbers go to the numbers-* artifacts.
name: S12.0 spike

on:
  workflow_dispatch:
    inputs:
      ship:
        description: Preferred spike ship; the next candidate is taken if its model changed since holo-v3
        type: choice
        options: [ORIG_100i, AEGS_Avenger_Titan, CNOU_Nomad]
        default: ORIG_100i

permissions:
  contents: read

concurrency:
  group: spike
  cancel-in-progress: false

env:
  APP_REPO: MRiediger/sc-cargoplan
  APP_TAG: v0.5.1
  HOLO_TAG: holo-v3
  UA: sc-cargoplan-outlines/0.2 (fan project)

jobs:
  chain:
    name: chain (ubuntu 24.04)
    # ubuntu-latest is 26.04 since 2026; Python 3.14.5 (the holo-v3 pin) exists only for 22.04/24.04 (S12.0 finding).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SPIKE_OUT: ${{ github.workspace }}/out
      HOLO_WORK: ${{ github.workspace }}/work/holo
    steps:
      - uses: actions/checkout@v7

      - name: Check out the app at its tag
        uses: actions/checkout@v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_TAG }}
          path: app

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.5'

      - uses: actions/setup-node@v7
        with:
          node-version: '24.16.0'

      - name: Toolchain against the pins
        run: |
          source spike/say.sh
          t=$(now); python -m pip install --disable-pip-version-check -q -r spike/requirements.txt; num setup.pip.s "$(since "$t")"
          t=$(now); npm ci --prefix spike --no-audit --no-fund --silent; num setup.npm.s "$(since "$t")"
          py=$(python -c 'import platform; print(platform.python_version())')
          np=$(python -c 'import numpy; print(numpy.__version__)')
          cv=$(python -m pip show opencv-python-headless | sed -n 's/^Version: //p')
          nd=$(node --version)
          ms=$(node -p "require('./spike/node_modules/meshoptimizer/package.json').version")
          ps=$(pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')
          got="python $py, numpy $np, opencv-python-headless $cv, node $nd, meshoptimizer $ms"
          want="python 3.14.5, numpy 2.5.3, opencv-python-headless 5.0.0.93, node v24.16.0, meshoptimizer 1.3.0"
          for kv in "python $py" "numpy $np" "opencv $cv" "node $nd" "meshoptimizer $ms" "pwsh $ps"; do num "version.${kv%% *}" "${kv#* }"; done
          num runner.image "$ImageOS $ImageVersion"
          say "Toolchain (ubuntu 24.04)" "installed versions against the TOOLS.md pins: $want" \
              "$got; pwsh $ps; runner $ImageOS $ImageVersion" \
              "$([ "$got" = "$want" ] && echo none || echo 'a version differs from its pin: finding for TOOLS.md')"

      - name: Restore the catalog cache (the API is called only without it)
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: spike-catalog-v1

      - name: Motherlode API (one call) and cargo page (one GET)
        id: fetch
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MOTHERLODE_API_KEY: ${{ secrets.MOTHERLODE_API_KEY }}
        run: |
          mkdir -p cache/raw
          echo "fetched=1" >> "$GITHUB_OUTPUT"
          date -u +%FT%TZ > cache/raw/fetched-at
          api=$(curl -sS -o cache/raw/api.json -D cache/raw/api.headers -w '%{http_code} %{time_total} %{size_download}' \
                -H "Authorization: Bearer $MOTHERLODE_API_KEY" -A "$UA" https://cryon.rocks/api/public/v1/cargo-grids || true)
          echo "${api:-000 0 0}" > cache/raw/api.status
          page=$(curl -sS -o cache/raw/page.txt -D cache/raw/page.headers -w '%{http_code} %{time_total} %{size_download}' \
                 -H 'RSC: 1' -A "$UA" https://cryon.rocks/ops/cargo || true)
          echo "${page:-000 0 0}" > cache/raw/page.status
          echo "API: $(cat cache/raw/api.status); page: $(cat cache/raw/page.status)"

      # Saved even when the call failed: a re-run then finds the cache and never calls the API again.
      - name: Save the catalog cache
        if: always() && steps.fetch.outcome != 'skipped' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: cache
          key: spike-catalog-v1

      # Everything after the fetch is one script, the same one a local test runs in WSL Ubuntu 24.04.
      - name: Catalog, probe, chain, anchor, comparisons (spike/chain-job.sh)
        env:
          FETCHED: ${{ steps.fetch.outputs.fetched }}
        run: bash spike/chain-job.sh "${{ inputs.ship }}"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: built
          path: built
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numbers-chain
          path: out
          retention-days: 7

  gate-a:
    name: gate-a (windows, v0.5.1 as released)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SPIKE_OUT: ${{ github.workspace }}/out
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the app at its tag
        uses: actions/checkout@v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_TAG }}
          path: app

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: app/global.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.5'

      - name: Runner, holo releases, build
        run: |
          source spike/say.sh
          seg=$(sha256sum /c/Windows/Fonts/segoeui.ttf 2>/dev/null | cut -c1-16 || echo missing)
          t=$(now)
          gh release download "$HOLO_TAG" -R "$APP_REPO" -D holo-v3
          gh release download holo-v2 -R "$APP_REPO" -D holo-v2
          num gate.download.s "$(since "$t")"
          t=$(now)
          dotnet build app/tests/CargoPlan.App.Tests -c Release > build.log 2>&1 || { tail -n 60 build.log; exit 1; }
          b=$(since "$t"); num gate.build.s "$b"
          num runner.image "$ImageOS $ImageVersion"; num runner.segoeui "$seg"; num dotnet "$(dotnet --version)"
          say "Gate runner (gate-a)" "runner image, Segoe UI, holo-v3 and holo-v2 assets, Release build of CargoPlan.App.Tests at $APP_TAG" \
              "image $ImageOS $ImageVersion, segoeui.ttf $seg, dotnet $(dotnet --version); holo-v3 $(ls holo-v3 | wc -l) files, holo-v2 $(ls holo-v2 | wc -l) files; build $b s" \
              "none"

      - name: Run A1 - v0.5.1 with holo-v3, no baseline (every PNG)
        run: bash spike/pictures.sh a1 holo-v3

      - name: Run A2 - holo-v2 against A1 (the real v2 -> v3 changes, expected to fail)
        run: |
          bash spike/pictures.sh a2 holo-v2 pics/a1
          python spike/csvdiff.py a1-vs-a2 pics/a1 pics/a2

      - uses: actions/upload-artifact@v7
        with:
          name: a1-csv
          path: |
            pics/a1/*.csv
            pics/a1/*.txt
            pics/a1.log
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: a1-png
          path: pics/a1/png
          retention-days: 7

      - uses: actions/upload-artifact@v7
        with:
          name: a2
          path: |
            pics/a2
            pics/a2.log
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numbers-gate-a
          path: out
          retention-days: 7

  gate-b:
    name: gate-b (windows, same VM old vs new)
    needs: [chain, gate-a]
    if: always() && needs.gate-a.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      SPIKE_OUT: ${{ github.workspace }}/out
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Check out the app at its tag
        uses: actions/checkout@v7
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_TAG }}
          path: app

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: app/global.json

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.5'

      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: built
          path: built

      # The artifact keeps the a1/ prefix (common root pics/ of its paths).
      - uses: actions/download-artifact@v8
        with:
          name: a1-csv
          path: pics

      - name: Runner, holo-v3, build
        run: |
          source spike/say.sh
          t=$(now); gh release download "$HOLO_TAG" -R "$APP_REPO" -D holo-v3; num gate.download.s "$(since "$t")"
          t=$(now)
          dotnet build app/tests/CargoPlan.App.Tests -c Release > build.log 2>&1 || { tail -n 60 build.log; exit 1; }
          b=$(since "$t"); num gate.build.s "$b"
          num runner.image "$ImageOS $ImageVersion"
          say "Gate runner (gate-b)" "runner image, holo-v3, Release build at $APP_TAG" "image $ImageOS $ImageVersion; build $b s" "none"

      - name: Run B0 - v0.5.1 as released, no baseline (K1)
        run: bash spike/pictures.sh b0 holo-v3

      - name: Swap in the built files and rebuild (spike/swap.sh)
        id: swap
        run: |
          bash spike/swap.sh
          echo "id=$(cat "$SPIKE_OUT/swap.id")" >> "$GITHUB_OUTPUT"

      - name: Run B - built files, baseline B0, expected the spike ship
        if: steps.swap.outputs.id != ''
        run: bash spike/pictures.sh b holo-v3 pics/b0 "${{ steps.swap.outputs.id }}"

      - name: Hash comparisons (K1 same VM, VM to VM)
        if: always()
        run: |
          ID="${{ steps.swap.outputs.id }}"
          if [ -n "$ID" ]; then
            python spike/csvdiff.py b0-vs-b pics/b0 pics/b "$ID"
            python spike/csvdiff.py a1-vs-b pics/a1 pics/b "$ID"
          fi
          python spike/csvdiff.py a1-vs-b0 pics/a1 pics/b0

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b0
          path: |
            pics/b0
            pics/b0.log
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: b
          path: |
            pics/b
            pics/b.log
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: numbers-gate-b
          path: out
          retention-days: 7
